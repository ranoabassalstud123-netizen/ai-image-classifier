<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Classifier</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            padding:20px;
        }

        .container{
            background:#111827;
            width:500px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 0 25px rgba(0,0,0,0.4);
            text-align:center;
        }

        h1{
            margin-bottom:10px;
            font-size:32px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:20px;
        }

        form{
            margin-bottom:20px;
        }

        input[type="file"]{
            width:100%;
            padding:12px;
            border:2px dashed #3b82f6;
            border-radius:12px;
            background:#1e293b;
            color:white;
            margin-bottom:20px;
            cursor:pointer;
        }

        button{
            background:#3b82f6;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:12px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2563eb;
            transform:scale(1.05);
        }

        .result{
            margin-top:25px;
            padding:20px;
            background:#1e293b;
            border-radius:15px;
        }

        .result h2{
            margin-bottom:15px;
            color:#60a5fa;
        }

        img{
            width:100%;
            border-radius:15px;
            margin-top:15px;
            border:3px solid #3b82f6;
        }

        .predictions{
            margin-top:15px;
        }

        .predictions p{
            background:#0f172a;
            padding:12px;
            border-radius:10px;
            margin:10px 0;
            font-size:18px;
        }

        #loading{
            font-size:18px;
            color:#60a5fa;
            animation:pulse 1s infinite;
        }

        @keyframes pulse{

            0%{
                opacity:0.3;
            }

            50%{
                opacity:1;
            }

            100%{
                opacity:0.3;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>AI Image Classifier</h1>

        <p>Upload an image and let AI predict what it is.</p>

        <form method="POST" enctype="multipart/form-data">

            <input type="file" name="image" id="imageInput" required>

            <!-- Preview Image -->
            <img id="preview"
                 style="display:none; margin-top:20px; width:100%; border-radius:15px; border:3px solid #3b82f6;">

            <br><br>

            <button type="submit" id="predictBtn">
                Predict Image
            </button>

            <!-- Loading Animation -->
            <p id="loading" style="display:none; margin-top:15px;">
                Analyzing Image...
            </p>

        </form>

        {% if prediction %}

        <div class="result">

            <h2>Prediction: {{ prediction }}</h2>

            <div class="predictions">

                {% for label, confidence in top_predictions %}

                    <p>
                        {{ label }} — {{ confidence }}%
                    </p>

                {% endfor %}

            </div>

            <img src="{{ image_path }}">

        </div>

        {% endif %}

    </div>

    <script>

        // Preview Image

        const imageInput = document.getElementById("imageInput");

        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function(){

            const file = this.files[0];

            if(file){

                preview.style.display = "block";

                preview.src = URL.createObjectURL(file);

            }

        });

        // Loading Animation

        const form = document.querySelector("form");

        const loading = document.getElementById("loading");

        form.addEventListener("submit", function(){

            loading.style.display = "block";

        });

    </script>

</body>

</html>
